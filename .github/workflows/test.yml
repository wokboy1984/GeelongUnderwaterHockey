# Runs on every push and pull request (20 Oct 2026).
#
# Two gates, and they catch different things:
#
#   build-check  bundles the Netlify Functions exactly as Netlify does, so
#                a mistake that stops the site deploying is reported here
#                in about a minute instead of silently.
#   test         the unit suites: timetable, finance, forum and the
#                Melbourne-timezone logic.
#
# The build check exists because of a real four-day outage in Oct 2026: a
# reassigned `const` failed Netlify's build, Netlify reported only "exit
# code 2", and nothing local caught it — `node --check` verifies syntax but
# not this, and the tests don't import that file. Everything built in that
# window sat on main, undeployed, with no sign anything was wrong.
#
# Deliberately NOT a TypeScript type check: that flags patterns this
# codebase uses happily and Netlify accepts, so it would block working
# code. esbuild rejects what Netlify rejects, and nothing more.
#
# test/check.js is left out — it drives a real browser against a locally
# served copy, a much heavier job than this.
name: Checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 24 strips TypeScript types from the .mts files the tests
          # import, with no build step or extra flags.
          node-version: '24'
      - run: npm ci
      - name: Will it build?
        run: npm run build-check
      - name: Unit tests
        run: npm test
